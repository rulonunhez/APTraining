spring:
  application:
    name: aptraining-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aptraining}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  file:
    path: ${LOG_DIR:logs}
  level:
    root: INFO
    com.aptraining: INFO
    org.springframework.security: INFO
    org.springframework.security.web.FilterChainProxy: WARN
    org.springframework.security.web.authentication: WARN

jwt:
  secret: ${JWT_SECRET}

aws:
  region: ${AWS_REGION:eu-north-1}
  bucket: ${AWS_S3_BUCKET:aptraining-media-dev-639920117896}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
